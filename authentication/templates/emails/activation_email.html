<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#ffffff; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0">
          <tr>
            <td align="center" style="padding-bottom: 30px;">
              <span style="font-size:28px; font-weight:bold; color:#4b3cf5;">&#9658;</span>
              <span style="font-size:26px; font-weight:bold; letter-spacing:1px; color:#5b3cf5;">VIDEOFLIX</span>
            </td>
          </tr>
          <tr>
            <td style="color:#222222; font-size:15px; line-height:1.6;">
              <p>Dear {{ email }},</p>
              <p>Thank you for registering with Videoflix. To complete your registration and verify your email address, please click the link below:</p>
            </td>
          </tr>
          <tr>
            <td align="left" style="padding: 20px 0;">
              <a href="{{ activation_link }}" style="background-color:#4b3cf5; color:#ffffff; text-decoration:none; padding:14px 32px; border-radius:24px; font-weight:bold; font-size:15px; display:inline-block;">Activate account</a>
            </td>
          </tr>
          <tr>
            <td style="color:#222222; font-size:15px; line-height:1.6;">
              <p>If you did not create an account with us, please disregard this email.</p>
              <p>Best regards,<br>Your Videoflix Team.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
